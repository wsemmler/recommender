<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">
  <title>Little Library</title>

  <style>
    body {
      background-color: #f5f5f5;
    }

    .dashboard-panel {
      width: 900px;
      max-width: 90%;
      background-color: #fff;
      border-radius: 40px;
      padding: 20px;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .dashboard-wrapper {
      transform: scale(0.9);
      transform-origin: top center;
      width: 100%;
      margin: 0 auto;
    }

    .tab-pane {
      overflow-y: auto;
      flex: 1;
    }

    #books-list, #recommendations, #movies-list {
      margin-top: 10px;
    }

    #books-list .col-md-3,
    #recommendations .col-md-3,
    #movies-list .col-md-3 {
      margin-bottom: 1rem;
    }

    .card {
      border-radius: 10px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: top;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 0.8rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-header {
      font-weight: bold;
      font-size: 1.2rem;
      color: #fff;
      background-color: #343a40;
      padding: 6px 8px;
      position: sticky;
      top: 0;
      z-index: 5;
      border-radius: 4px 4px 0 0;
      margin-bottom: 5px;
    }

    #monitoring-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      background: #f8f9fa;
      border: 1px solid #ddd;
      padding: 10px;
      z-index: 9999;
      font-size: 12px;
      width: 250px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">    
      <a class="navbar-brand" href="#">Little Library</a>
    </div>
  </nav>

  <!-- Dashboard Panel with Tabs -->
  <div class="d-flex justify-content-center mt-4 dashboard-wrapper">
    <div class="dashboard-panel">

      <!-- Tabs navigation -->
      <ul class="nav nav-pills mb-3" id="dashboard-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="books-tab" data-toggle="pill" data-target="#books-content" type="button" role="tab" aria-controls="books-content" aria-selected="true">
            Books
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="movies-tab" data-toggle="pill" data-target="#movies-content" type="button" role="tab" aria-controls="movies-content" aria-selected="false">
            Movies
          </button>
        </li>
      </ul>

      <!-- Tabs content -->
      <div class="tab-content" id="dashboard-tabs-content">
        
        <!-- Books Tab -->
        <div class="tab-pane fade show active" id="books-content" role="tabpanel" aria-labelledby="books-tab">

          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title text-center">Search Books</h5>
              <div class="input-group">
                <input id="search-input" type="text" class="form-control" placeholder="Type Author, Title, Category...">
                <div class="input-group-append">
                  <button id="search-button" class="btn btn-dark">Search</button>
                </div>
              </div>
              <div id="status" class="mt-2 text-muted small">Model status: <span id="model-status">Loading USE...</span></div>
            </div>
          </div>

          <div>
            <div class="section-header">Books</div>
            <div id="books-list" class="row"></div>
          </div>

          <hr>

          <div>
            <div class="section-header">Recommendations</div>
            <div id="recommendations" class="row"></div>
          </div>
        </div>

        <!-- Movies Tab -->
        <div class="tab-pane fade" id="movies-content" role="tabpanel" aria-labelledby="movies-tab">
          <div class="card mb-3">
            <div class="card-body">
              <h5 class="card-title text-center">Movie Recommendations</h5>
              <p class="text-muted">Coming soon...</p>
              <div id="movies-list" class="row"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">Book Details</h5>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Monitoring Panel -->
  <div id="monitoring-panel">
    <div><strong>Model Status</strong></div>
    <div id="model-status">Not loaded</div>
    <div id="ranking-status">Ranking model: N/A</div>
    <div id="training-status">Training: N/A</div>
    <div id="memory-status">Memory: N/A</div>
  </div>

  <!-- jQuery + Bootstrap -->
  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js"></script>

  <!-- TensorFlow.js + USE -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder@1.3.3/dist/universal-sentence-encoder.min.js"></script>

  <!-- Your script -->
  <script src="script.js"></script>
</body>
</html>
